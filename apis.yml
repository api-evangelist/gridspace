aid: gridspace
name: Gridspace
description: >-
  Gridspace is a voice AI company (founded 2013) that now operates as Guava
  (goguava.ai) — a voice agent platform built for regulated industries such as
  healthcare, banking, insurance, BPOs, and government. Guava provides an
  end-to-end conversational voice stack (ASR, LLM, TTS, plus compliance
  guardrails) exposed through Python, TypeScript, and Elixir SDKs, a "guava" CLI,
  a managed cloud deployment platform, and a REST API for managing conversations,
  transcripts, recordings, and SMS. It supports inbound and outbound calling over
  WebRTC and SIP, with SOC 2 Type II, HITRUST i1, and PCI DSS posture and built-in
  TCPA / A2P 10DLC / SHAKEN-STIR telephony compliance workflows. The legacy
  gridspace.com domain now redirects to goguava.ai.

openapi: 3.2.0
info:
  title: Guava API Server Conversations API
  version: master
servers:
- url: https://app.goguava.ai
tags:
- name: Conversations
paths:
  /v1/conversations/{call_id}:
    delete:
      summary: Delete conversation
      description: Deletes a conversation, including its transcript and recordings.
      operationId: api_delete_conversation_v1_conversations__call_id__delete
      security:
      - APIKey: []
      parameters:
      - name: call_id
        in: path
        required: true
        schema:
          type: string
          description: ID of the call to delete.
          title: Call Id
        description: ID of the call to delete.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Conversation not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Conversations
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ErrorResponse:
      properties:
        detail:
          type: string
          title: Detail
      type: object
      required:
      - detail
      title: ErrorResponse
    OkResponse:
      properties:
        ok:
          type: boolean
          const: true
          title: Ok
          default: true
      type: object
      title: OkResponse
  securitySchemes:
    APIKey:
      type: http
      description: 'A Guava API key, sent as `Authorization: Bearer <key>`.'
      scheme: bearer
